[completion]
provider = "r2r"
concurrent_request_limit = 128

[ingestion]
provider = "unstructured_local"
strategy = "auto"
chunking_strategy = "by_title"
new_after_n_chars = 2_048
max_characters = 4_096
combine_under_n_chars = 1_024
overlap = 1_024
    [ingestion.extra_parsers]
    pdf = "zerox"

[orchestration]
provider = "hatchet"
kg_creation_concurrency_limit = 32
ingestion_concurrency_limit = 16
kg_concurrency_limit = 8

[agent]
# Self-hosted web search and scraping tools
# Requires the following environment variables:
#   SEARXNG_BASE_URL   - URL of your SearxNG instance (e.g., http://localhost:8888)
#   FIRECRAWL_API_URL  - URL of your self-hosted Firecrawl instance (optional, for self-hosted)
#   FIRECRAWL_API_KEY  - API key for Firecrawl (required for cloud, optional for self-hosted)
rag_tools = [
    "search_file_descriptions",
    "search_file_knowledge",
    "get_file_content",
    # SearxNG tools (self-hosted metasearch)
    "searxng_search",
    "searxng_extract",
    # Firecrawl tools (supports both cloud and self-hosted)
    "web_scrape",
]
